{% if field.field.widget.input_type == "checkbox" %}
<div class="field field--check{% if field.errors %} field--error{% endif %}">
  <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% for error in field.errors %}<p class="field__error" role="alert">{{ error }}</p>{% endfor %}
</div>
{% else %}
<div class="field{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}" class="field__label">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field__help">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error" role="alert">{{ error }}</p>{% endfor %}
</div>
{% endif %}
