{% if messages %}
<div class="flash-stack" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert--{{ message.tags|default:'info' }}" data-dismissible>
    <span>{{ message }}</span>
    <button type="button" class="alert__close" aria-label="Dismiss message" data-dismiss>&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
